<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="title desc">
  <title id="title">VSTO to OfficeJS migration architecture</title>
  <desc id="desc">Diagram showing the legacy C# .NET VSTO add-in architecture on the left transitioning to a cross-platform OfficeJS web add-in with a React frontend and FastAPI backend on the right.</desc>
  <rect width="900" height="360" fill="#0a0a0a" />

  <rect x="30" y="60" width="330" height="240" rx="12" fill="#18181b" stroke="#3f3f46" stroke-width="1.5" />
  <text x="195" y="95" text-anchor="middle" fill="#e4e4e7" font-family="ui-sans-serif, system-ui" font-size="16" font-weight="600">Legacy Add-in</text>
  <text x="195" y="118" text-anchor="middle" fill="#71717a" font-family="ui-sans-serif, system-ui" font-size="12">Windows-only</text>

  <rect x="55" y="140" width="280" height="42" rx="6" fill="#27272a" />
  <text x="195" y="166" text-anchor="middle" fill="#d4d4d8" font-family="ui-monospace, monospace" font-size="12">C# .NET VSTO</text>

  <rect x="55" y="192" width="280" height="42" rx="6" fill="#27272a" />
  <text x="195" y="218" text-anchor="middle" fill="#d4d4d8" font-family="ui-monospace, monospace" font-size="12">Excel · Word · PowerPoint COM APIs</text>

  <rect x="55" y="244" width="280" height="42" rx="6" fill="#27272a" />
  <text x="195" y="270" text-anchor="middle" fill="#d4d4d8" font-family="ui-monospace, monospace" font-size="12">Deployed via ClickOnce, per-machine</text>

  <path d="M370 180 L520 180" stroke="#60a5fa" stroke-width="2" fill="none" marker-end="url(#arrow)" />
  <text x="445" y="165" text-anchor="middle" fill="#60a5fa" font-family="ui-sans-serif, system-ui" font-size="12">migrate</text>

  <rect x="540" y="40" width="330" height="280" rx="12" fill="#18181b" stroke="#3b82f6" stroke-width="1.5" />
  <text x="705" y="75" text-anchor="middle" fill="#e4e4e7" font-family="ui-sans-serif, system-ui" font-size="16" font-weight="600">OfficeJS Web Add-in</text>
  <text x="705" y="98" text-anchor="middle" fill="#71717a" font-family="ui-sans-serif, system-ui" font-size="12">Cross-platform, browser-hosted</text>

  <rect x="565" y="118" width="280" height="42" rx="6" fill="#27272a" />
  <text x="705" y="144" text-anchor="middle" fill="#d4d4d8" font-family="ui-monospace, monospace" font-size="12">React + TypeScript UI</text>

  <rect x="565" y="170" width="280" height="42" rx="6" fill="#27272a" />
  <text x="705" y="196" text-anchor="middle" fill="#d4d4d8" font-family="ui-monospace, monospace" font-size="12">Office.js task pane APIs</text>

  <rect x="565" y="222" width="280" height="42" rx="6" fill="#27272a" />
  <text x="705" y="248" text-anchor="middle" fill="#d4d4d8" font-family="ui-monospace, monospace" font-size="12">Python · FastAPI backend (GenAI)</text>

  <rect x="565" y="274" width="280" height="30" rx="6" fill="#1e3a8a" />
  <text x="705" y="294" text-anchor="middle" fill="#bfdbfe" font-family="ui-monospace, monospace" font-size="11">Ships to Excel, Word &amp; PowerPoint on any OS</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#60a5fa" />
    </marker>
  </defs>
</svg>
