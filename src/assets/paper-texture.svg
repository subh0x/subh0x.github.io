<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360" viewBox="0 0 360 360">
<defs>
<filter id="fine" x="0" y="0" width="100%" height="100%">
<feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="3" stitchTiles="stitch"></feTurbulence>
<feColorMatrix type="matrix" values="0 0 0 0 0.36  0 0 0 0 0.24  0 0 0 0 0.12  0 0 0 0.8 -0.46"></feColorMatrix>
</filter>
<filter id="fiber" x="0" y="0" width="100%" height="100%">
<feTurbulence type="fractalNoise" baseFrequency="0.035 0.06" numOctaves="2" seed="8" stitchTiles="stitch"></feTurbulence>
<feColorMatrix type="matrix" values="0 0 0 0 0.45  0 0 0 0 0.32  0 0 0 0 0.16  0 0 0 0.45 -0.24"></feColorMatrix>
</filter>
<filter id="blotch" x="0" y="0" width="100%" height="100%">
<feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="3" seed="15" stitchTiles="stitch"></feTurbulence>
<feColorMatrix type="matrix" values="0 0 0 0 0.55  0 0 0 0 0.4  0 0 0 0 0.2  0 0 0 0.35 -0.15"></feColorMatrix>
</filter>
</defs>
<rect width="360" height="360" filter="url(#blotch)"></rect>
<rect width="360" height="360" filter="url(#fiber)"></rect>
<rect width="360" height="360" filter="url(#fine)"></rect>
</svg>